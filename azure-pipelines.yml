trigger:
 - main

pool: pharmapool

stages:
  - stage: teraforminitandvalidate
    jobs:
      - job: terraforminitandvalidate
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/dev/parentmodule'
            backendServiceArm: 'Subscription 1(9264fe29-a071-4126-80b4-62fdfb3539e4)'
            backendAzureRmOverrideSubscriptionID: '9264fe29-a071-4126-80b4-62fdfb3539e4'
            backendAzureRmResourceGroupName: 'rgbknd'
            backendAzureRmStorageAccountName: 'storagebknd'
            backendAzureRmContainerName: 'santanu'
            backendAzureRmKey: 'santanu.tfstate'

  - stage: terraformvalidate
    jobs:
      - job: 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/dev/parentmodule'
